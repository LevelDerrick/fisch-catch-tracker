<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b"/>
      <stop offset="55%" stop-color="#0d2436"/>
      <stop offset="100%" stop-color="#051119"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1b4d5c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1b4d5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waterLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fd1c5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4fd1c5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <!-- decorative circles like bubbles -->
  <circle cx="120" cy="80" r="6" fill="#4fd1c5" opacity="0.18"/>
  <circle cx="160" cy="130" r="3" fill="#4fd1c5" opacity="0.15"/>
  <circle cx="1080" cy="90" r="8" fill="#4fd1c5" opacity="0.18"/>
  <circle cx="1040" cy="150" r="4" fill="#4fd1c5" opacity="0.15"/>
  <circle cx="90" cy="280" r="5" fill="#4fd1c5" opacity="0.15"/>
  <circle cx="1120" cy="300" r="7" fill="#4fd1c5" opacity="0.14"/>
  <circle cx="600" cy="40" r="3" fill="#ffffff" opacity="0.1"/>
  <circle cx="700" cy="330" r="4" fill="#4fd1c5" opacity="0.12"/>

  <!-- wave lines -->
  <path d="M0 250 Q 150 230 300 250 T 600 250 T 900 250 T 1200 250" fill="none" stroke="url(#waterLine)" stroke-width="2" opacity="0.5"/>
  <path d="M0 320 Q 150 300 300 320 T 600 320 T 900 320 T 1200 320" fill="none" stroke="url(#waterLine)" stroke-width="2" opacity="0.4"/>
  <path d="M0 60 Q 150 40 300 60 T 600 60 T 900 60 T 1200 60" fill="none" stroke="url(#waterLine)" stroke-width="1.5" opacity="0.3"/>

  <!-- fishing hook / line decorative path, subtle -->
  <path d="M600 10 C 600 60, 640 70, 640 110 C 640 150, 600 150, 600 130" fill="none" stroke="#4fd1c5" stroke-width="1.5" opacity="0.12"/>

  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="60.0" fill="#ffffff" font-weight="bold">
    <tspan x="600" dy="0">Fisch Roblox Script</tspan>
  </text>

  <text x="600" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Tired of manually logging every catch in Fisch?</tspan>
  </text>
</svg>